debug=false

logging.level.org.springframework.boot.autoconfigure=INFO
logging.level.com.example.myfirstapp=INFO

spring.application.name=MyFirstApp

# --------------------------------------------------
# H2 Test Database
# --------------------------------------------------

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create tables from JPA entities for every test run
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --------------------------------------------------
# Actuator / Metrics
# --------------------------------------------------

management.endpoints.web.exposure.include=health,metrics,prometheus

management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

management.metrics.tags.application=my-first-app

# --------------------------------------------------
# Resilience4j
# --------------------------------------------------

resilience4j.retry.instances.externalApiRetry.max-attempts=2
resilience4j.retry.instances.externalApiRetry.wait-duration=2s
resilience4j.retry.instances.externalApiRetry.enable-exponential-backoff=true
resilience4j.retry.instances.externalApiRetry.exponential-backoff-multiplier=2

resilience4j.retry.instances.externalApiRetry.retry-exceptions[0]=org.springframework.web.client.RestClientResponseException