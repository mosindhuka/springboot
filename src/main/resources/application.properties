debug=false
logging.level.org.springframework.boot.autoconfigure=INFO

#management.endpoints.web.exposure.include=*

management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

management.metrics.tags.application=my-first-app

spring.application.name=MyFirstApp
logging.level.com.example.myfirstapp=INFO

spring.datasource.jdbc-url=jdbc:mysql://localhost:3306/test
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.test2.jdbc-url=jdbc:mysql://localhost:3306/sakila
spring.datasource.test2.username=root
spring.datasource.test2.password=root

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
logging.level.org.springframework.ai.vectorstore.pgvector=DEBUG



kafka.cluster1.bootstrap-servers=localhost:9092,localhost:9093,localhost:9094
kafka.cluster2.bootstrap-servers=localhost:9092,localhost:9093,localhost:9094

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer
spring.kafka.consumer.group-id=my-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Retry configuration
resilience4j.retry.instances.externalApiRetry.max-attempts=2
resilience4j.retry.instances.externalApiRetry.wait-duration=2s
resilience4j.retry.instances.externalApiRetry.enable-exponential-backoff=true
resilience4j.retry.instances.externalApiRetry.exponential-backoff-multiplier=2

# Exceptions that should trigger retry
resilience4j.retry.instances.externalApiRetry.retry-exceptions[0]=org.springframework.web.client.RestClientResponseException

# ==========================================
# MULTIPART FILE UPLOAD
# ==========================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB


# ==========================================
# DATASOURCE - POSTGRESQL
# ==========================================
spring.datasource.pg.url=jdbc:postgresql://localhost:5432/ragdb
spring.datasource.pg.username=postgres
spring.datasource.pg.password=root
spring.datasource.pg.driver-class-name=org.postgresql.Driver


spring.datasource.pg.hikari.maximum-pool-size=15
spring.datasource.pg.hikari.minimum-idle=3
spring.datasource.pg.hikari.connection-timeout=30000

# Spring AI Model Configuration
spring.ai.model.chat=ollama

# Ollama Configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen3.5:4b
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.chat.options.num-predict=1000

# Embedding Model
spring.ai.ollama.embedding.options.model=nomic-embed-text

# ==========================================
# SPRING AI - PGVECTOR
# ==========================================
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.remove-existing-vector-store-table=false

# ==========================================
# RAG CONFIGURATION
# ==========================================
rag.storage-path=./uploads
rag.chunk-size=1000
rag.chunk-overlap=150
rag.top-k=5
rag.similarity-threshold=0.65
rag.max-upload-size=52428800


# ==========================================
# SWAGGER / OPENAPI
# ==========================================
springdoc.swagger-ui.path=/swagger-ui.html




